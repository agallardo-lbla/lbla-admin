name: "[DESHABILITADO] CI — LBLA Admin (React / Vite)"

# Triggers automáticos desactivados — 07-LBLA-ADMIN deprecado el 12/10/2026.
# Módulo absorbido por Portal LBLA: https://core.lbla.cl/portal/admin/
# on:
#   push:
#     branches: [ main, master, develop ]
#   pull_request:
#     branches: [ main, master ]
on:
  workflow_dispatch:


concurrency:
  group: ci-lbla-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ⚛️ Pruebas y Compilación Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Instalar Dependencias Limpias
        run: npm ci

      - name: 🧪 Ejecutar Suite de Pruebas Unitarias
        run: npm test

      - name: 🏗️ Compilar Proyecto para Producción (Vite Build)
        run: npm run build

      - name: 📤 Guardar Artefacto Compilado (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: lbla-admin-dist
          path: dist/
          retention-days: 7
