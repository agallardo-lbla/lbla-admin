name: CD — Despliegue Controlado a cPanel (admin.lbla.cl)

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular despliegue sin transferir archivos a cPanel (Dry-Run)'
        required: true
        type: boolean
        default: false
      deploy_reason:
        description: 'Motivo y justificación del despliegue productivo'
        required: true
        type: string
        default: 'Despliegue inicial de LBLA Admin en admin.lbla.cl'

concurrency:
  group: deploy-lbla-admin-production
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: ⚛️ Pruebas y Compilación para Producción (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Instalar Dependencias Limpias
        run: npm ci

      - name: 🧪 Ejecutar Suite de Pruebas Unitarias
        run: npm test

      - name: 🏗️ Compilar Proyecto para Producción (Vite Build)
        env:
          VITE_CORE_API_URL: 'https://core.lbla.cl/api/v1'
          VITE_LBLA_ID_ISSUER: 'https://core.lbla.cl'
        run: npm run build

      - name: 📤 Guardar Artefacto Compilado (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: lbla-admin-dist
          path: dist/
          retention-days: 1

  deploy-production:
    name: 🚀 Despliegue Estático a cPanel (admin.lbla.cl)
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://admin.lbla.cl

    steps:
      - name: 📥 Descargar Artefacto Compilado (dist/)
        uses: actions/download-artifact@v4
        with:
          name: lbla-admin-dist
          path: dist

      - name: 🛡️ Verificación Preventiva (Dry-Run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "======================================================"
          echo "MODO SIMULACIÓN (DRY-RUN) ACTIVO: NO SE MODIFICA CPANEL"
          echo "Motivo: ${{ inputs.deploy_reason }}"
          echo "Artefacto compilado verificado satisfactoriamente."
          echo "======================================================"

      - name: 🌐 Desplegar Archivos a Servidor cPanel (FTPS)
        if: ${{ !inputs.dry_run }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.CPANEL_ADMIN_TARGET_DIR || 'public_html/admin.lbla.cl/' }}

      - name: 🩺 Ejecutar Health Check Post-Despliegue
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Ejecutando verificación HTTP sobre https://admin.lbla.cl/..."
          HTTP_STATUS=$(curl -s -k -L -o /dev/null -w "%{http_code}" https://admin.lbla.cl/ || echo "000")
          echo "Código HTTP recibido: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "[PASS] Despliegue verificado: LBLA Admin responde satisfactoriamente."
          else
            echo "[WARN] Código HTTP recibido: $HTTP_STATUS."
          fi
