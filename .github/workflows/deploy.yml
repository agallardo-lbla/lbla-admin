# ============================================================
# PIPELINE DESHABILITADO — 12 de octubre de 2026
# ============================================================
# Este workflow fue desactivado porque 07-LBLA-ADMIN ha sido
# formalmente absorbido por Portal LBLA (09-LBLA-CORE/apps/portal/).
#
# El módulo de Administración y Gobernanza está disponible en:
#   https://core.lbla.cl/portal/admin/gestion/
#
# Para reactivar: renombrar este archivo a deploy.yml y
# restaurar el bloque `on:` original.
# ============================================================

# BLOQUE on: ORIGINAL (PRESERVADO COMO REFERENCIA - NO ACTIVO):
# on:
#   push:
#     branches:
#       - main
#   workflow_dispatch:
#     inputs:
#       dry_run:
#         description: 'Simular despliegue sin transferir archivos a cPanel (Dry-Run)'
#         required: false
#         type: boolean
#         default: false
#       deploy_reason:
#         description: 'Motivo y justificación del despliegue productivo'
#         required: false
#         type: string
#         default: 'Despliegue de LBLA Admin'

name: "[DESHABILITADO] CD — Despliegue Controlado a cPanel (admin.lbla.cl)"

# Trigger desactivado: sólo manual explícito (no se activa en push)
on:
  workflow_dispatch:
    inputs:
      confirm_reactivation:
        description: 'ATENCIÓN: Este pipeline está DESHABILITADO. Escribir CONFIRMAR para ejecutar manualmente.'
        required: true
        type: string
        default: ''

concurrency:
  group: deploy-lbla-admin-production
  cancel-in-progress: false

jobs:
  guard-decommission:
    name: 🚫 Pipeline Descomisionado — Portal LBLA reemplaza Admin SPA
    runs-on: ubuntu-latest
    steps:
      - name: Verificar confirmación explícita
        run: |
          if [ "${{ inputs.confirm_reactivation }}" != "CONFIRMAR" ]; then
            echo "======================================================================"
            echo "  ⚠️  PIPELINE DESHABILITADO — 07-LBLA-ADMIN DEPRECADO (12/10/2026)"
            echo "======================================================================"
            echo "  Este módulo ha sido absorbido por Portal LBLA."
            echo "  Módulo activo: https://core.lbla.cl/portal/admin/gestion/"
            echo "  Para reactivar, restaurar deploy.yml original y confirmar."
            echo "======================================================================"
            exit 1
          fi
          echo "Ejecución manual confirmada. Proceder con cautela."

      - name: Advertencia de módulo deprecado
        run: |
          echo "======================================================================"
          echo "  AVISO: admin.lbla.cl es un despliegue CONGELADO sin mantenimiento."
          echo "  No realizar cambios sin coordinación con Informática LBLA."
          echo "======================================================================"
